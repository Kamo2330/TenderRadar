{% extends "base.html" %}

{% block content %}
<div class="container mt-5" style="max-width: 480px;">
  <h1 class="mb-2">Sign in</h1>
  <p class="text-muted mb-4">Welcome back to TenderRadar.</p>

  {% if form.errors %}
    <div class="alert alert-danger">
      Please correct the error{{ form.errors|length|pluralize }} below.
    </div>
  {% endif %}

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary w-100 mt-2">Sign in</button>
  </form>

  <hr class="my-4">

  <p class="text-center mb-2">New here?</p>
  <a href="{% url 'signup' %}" class="btn btn-outline-primary w-100">Create account</a>
</div>
{% endblock %}
